name: CI

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        versions:
          [
            { os: windows-2025, arch: x64 },
            { os: windows-2025, arch: arm64 },
            { os: macos-26, arch: arm64 },
            { os: ubuntu-24.04, arch: x64 },
            { os: ubuntu-24.04, arch: arm64 },
            { os: ubuntu-24.04, arch: armhf },
          ]
    runs-on: ${{ matrix.versions.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/parts/ComputeNodeModulesCacheKey/ComputeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - uses: actions/cache@v6
        id: electron-rebuild-cache
        with:
          path: '~/.electron-gyp'
          key: ${{ runner.os }}-cacheElectronRebuild-${{ steps.nodeModulesCacheKey.outputs.value }}
      - uses: actions/cache@v6
        id: electron-builder-cache
        with:
          path: '~/.cache/electron-builder'
          key: ${{ runner.os }}-cacheElectronBuilder-${{ steps.nodeModulesCacheKey.outputs.value }}
      - uses: actions/cache@v6
        id: build-cache
        with:
          path: 'packages/build/.tmp/cachedDependencies'
          key: ${{ runner.os }}-build-cache-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: node packages/build/src/parts/InstallDependencies/InstallDependencies.ts
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          DOWNLOAD_BUILTIN_EXTENSIONS: 0
      - name: Compute builtin extensions cache key
        id: builtinExtensionsCacheKey
        run: echo "value=$(node packages/build/src/parts/ComputeBuiltinExtensionsCacheKey/ComputeBuiltinExtensionsCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: builtin-extensions-cache
        with:
          path: extensions
          key: builtinExtensions-${{ steps.builtinExtensionsCacheKey.outputs.value }}
      - name: Download Builtin Extensions
        run: node packages/build/src/parts/DownloadBuiltinExtensions/DownloadBuiltinExtensions.ts
        if: steps.builtin-extensions-cache.outputs.cache-hit != 'true'
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - name: install playwright dependencies (extension host worker tests)
        working-directory: ./packages/extension-host-worker-tests
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Build server
        run: npm run build:server
      - name: Test built server
        if: matrix.versions.os == 'ubuntu-24.04' && matrix.versions.arch == 'x64'
        run: npm run test:server
      - name: Test Static Export
        run: npm run test-static-export
      - name: Run extension host worker tests
        working-directory: ./packages/extension-host-worker-tests
        run: npm run e2e:headless:ci
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Build Electron App (deb, x64)
        if: matrix.versions.os == 'ubuntu-24.04' && matrix.versions.arch == 'x64'
        run: npm run build:electron:deb:x64
      - name: Build Electron App (deb, arm64)
        if: matrix.versions.os == 'ubuntu-24.04' && matrix.versions.arch == 'arm64'
        run: npm run build:electron:deb:arm64
      - name: Build Electron App (deb, armhf)
        if: matrix.versions.os == 'ubuntu-24.04' && matrix.versions.arch == 'armhf'
        run: npm run build:electron:deb:armhf
      - name: Configure optional macOS signing
        id: macos-signing
        if: matrix.versions.os == 'macos-26' && matrix.versions.arch == 'arm64'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          for secret in APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "macOS signing is disabled because one or more signing secrets are unavailable."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/lvce-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          printf '%s' "$CSC_LINK" | base64 -D > "$certificate_path"
          test -s "$api_key_path"
          test -s "$certificate_path"
          chmod 600 "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep 'Developer ID Application'
          rm "$certificate_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build Electron App (Macos dmg, arm64, unsigned)
        if: matrix.versions.os == 'macos-26' && matrix.versions.arch == 'arm64' && steps.macos-signing.outputs.enabled != 'true'
        run: npm run build:electron:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Electron App (Macos dmg, arm64, signed)
        if: matrix.versions.os == 'macos-26' && matrix.versions.arch == 'arm64' && steps.macos-signing.outputs.enabled == 'true'
        run: npm run build:electron:mac:arm64
        env:
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN_PATH }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Notarize macOS installer
        if: matrix.versions.os == 'macos-26' && matrix.versions.arch == 'arm64' && steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg_path="packages/build/.tmp/releases/lvce-arm64.dmg"
          xcrun notarytool submit "$dmg_path" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg_path"
      - name: Verify signed and notarized macOS installer
        if: matrix.versions.os == 'macos-26' && matrix.versions.arch == 'arm64' && steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        run: |
          dmg_path="packages/build/.tmp/releases/lvce-arm64.dmg"
          test -f "$dmg_path"
          mount_point="$(mktemp -d "${RUNNER_TEMP}/lvce-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point"
          app_path="$(find "$mount_point" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
      - name: Upload signed macOS installer
        if: matrix.versions.os == 'macos-26' && matrix.versions.arch == 'arm64' && steps.macos-signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lvce-macos-arm64
          path: packages/build/.tmp/releases/lvce-arm64.dmg
          if-no-files-found: error
      - name: Cache Electron Builder Dependencies (Windows)
        uses: actions/cache@v6
        id: electron-builder-cache-windows
        if: matrix.versions.os == 'windows-2025'
        with:
          path: '~\AppData\Local\electron-builder'
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('packages/build/package-lock.json') }}
      - name: Build Electron App (exe, x64)
        if: matrix.versions.os == 'windows-2025' && matrix.versions.arch == 'x64'
        run: npm run build:electron:windows:exe:x64
      - name: Build Electron App (exe, arm64)
        if: matrix.versions.os == 'windows-2025' && matrix.versions.arch == 'arm64'
        run: npm run build:electron:windows:exe:arm64
      - name: Build Electron App (AppImage)
        if: matrix.versions.os == 'ubuntu-24.04' && matrix.versions.arch == 'x64'
        run: npm run build:electron:app-image:x64
      - name: Build static site
        if: matrix.versions.os == 'ubuntu-24.04' && matrix.versions.arch == 'x64'
        run: npm run build:static
        env:
          PATH_PREFIX: /lvce-editor
      - name: Upload artifact
        if: matrix.versions.os == 'ubuntu-24.04' && matrix.versions.arch == 'x64'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./packages/build/.tmp/dist
      - name: Clean up
        run: rm -rf packages/build/.tmp
        shell: bash

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: ci
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
