name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/parts/ComputeNodeModulesCacheKey/ComputeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - uses: actions/cache@v6
        id: electron-rebuild-cache
        with:
          path: '~/.electron-gyp'
          key: ${{ runner.os }}-cacheElectronRebuild-${{ steps.nodeModulesCacheKey.outputs.value }}
      - uses: actions/cache@v6
        id: electron-builder-cache
        with:
          path: '~/.cache/electron-builder'
          key: ${{ runner.os }}-cacheElectronBuilder-${{ steps.nodeModulesCacheKey.outputs.value }}
      - uses: actions/cache@v6
        id: build-cache
        with:
          path: 'packages/build/.tmp/cachedDependencies'
          key: ${{ runner.os }}-build-cache-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: node packages/build/src/parts/InstallDependencies/InstallDependencies.ts
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          DOWNLOAD_BUILTIN_EXTENSIONS: 0
      - name: Compute builtin extensions cache key
        id: builtinExtensionsCacheKey
        run: echo "value=$(node packages/build/src/parts/ComputeBuiltinExtensionsCacheKey/ComputeBuiltinExtensionsCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: builtin-extensions-cache
        with:
          path: extensions
          key: builtinExtensions-${{ steps.builtinExtensionsCacheKey.outputs.value }}
      - name: Download Builtin Extensions
        run: node packages/build/src/parts/DownloadBuiltinExtensions/DownloadBuiltinExtensions.ts
        if: steps.builtin-extensions-cache.outputs.cache-hit != 'true'
      - run: npm run lint
      - run: npm run type-check
      - run: npx lerna run test --since origin/main
      - name: install playwright dependencies (extension host worker tests)
        working-directory: ./packages/extension-host-worker-tests
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test bundled font loading
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/extension-host-worker-tests
        run: npm run e2e:fonts
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Build static site
        run: npm run build:static:ignore-icon-theme
        env:
          PATH_PREFIX: /lvce-editor
      - name: Build server
        run: npm run build:server
      - name: Test built server
        if: matrix.os == 'ubuntu-24.04'
        run: npm run test:server
      - name: Test Process Explorer live component state
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/extension-host-worker-tests
        run: node src/_all.js --headless --test-name-prefix=viewlet.component-state-edit-process-explorer
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test Static Export
        run: npm run test-static-export
      - name: Test static command picker
        working-directory: ./packages/extension-host-worker-tests
        run: node src/_all.js --ci --headless --test-name-prefix=viewlet.quick-pick-builtin-commands
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run extension host worker tests
        working-directory: ./packages/extension-host-worker-tests
        run: npm run e2e:headless:ci
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test extension component state names
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.component-state-extension-names
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test live component state scrolling
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/extension-host-worker-tests
        run: node src/_all.js --headless --test-name-prefix=viewlet.component-state-refresh-scroll
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test live component automatic updates
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/extension-host-worker-tests
        run: node src/_all.js --headless --ci --test-name-prefix=viewlet.component-state-auto-update
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test component DOM context menu
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/extension-host-worker-tests
        run: node src/_all.js --headless --ci --test-name-prefix=viewlet.component-state-show-dom
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Test Problems live component state
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/extension-host-worker-tests
        run: node src/_all.js --headless --ci --test-name-prefix=viewlet.component-state-edit-problems
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Build Electron App (deb)
        if: matrix.os == 'ubuntu-24.04'
        run: npm run build:electron:deb
      - name: Build Electron App (Macos dmg, arm64)
        if: matrix.os == 'macos-26'
        run: npm run build:electron:mac:arm64
      - name: Cache Electron Builder Dependencies (Windows)
        uses: actions/cache@v6
        id: electron-builder-cache-windows
        if: matrix.os == 'windows-2025'
        with:
          path: '~\AppData\Local\electron-builder'
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('packages/build/package-lock.json') }}
      - name: Build Electron App (exe)
        if: matrix.os == 'windows-2025'
        run: npm run build:electron:windows:exe
      - name: Build Electron App (AppImage)
        if: matrix.os == 'ubuntu-24.04'
        run: npm run build:electron:app-image
      - name: Upload Electron App Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-app-${{ matrix.os }}
          path: packages/build/.tmp/releases/*
          if-no-files-found: error
      - name: Clean up
        run: rm -rf packages/build/.tmp
        shell: bash
